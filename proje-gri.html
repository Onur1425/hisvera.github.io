<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proje: Gri</title>
    <link rel="icon" type="image/jpeg" href="assets/images/HisVera.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier Prime', monospace;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .psy-bg {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: repeating-radial-gradient(
                circle at 50% 50%,
                transparent 0,
                rgba(255, 255, 255, 0.15) 2px,
                transparent 5px,
                transparent 60px
            );
            animation: hypnoticBreath 20s ease-in-out infinite alternate;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes hypnoticBreath {
            0% { transform: scale(1) rotate(0deg); filter: blur(2px); }
            100% { transform: scale(1.5) rotate(15deg); filter: blur(4px); }
        }
        
        .clock-container {
            position: absolute;
            top: 50%; left: 50%;
            width: 120vmax; height: 120vmax;
            transform: translate(-50%, -50%);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
        }
        
        .clock-hand {
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 60vmax;
            background: linear-gradient(to top, transparent 50%, rgba(255, 255, 255, 0.6) 100%);
            box-shadow: 0 -10px 20px rgba(255,255,255,0.4);
            transform-origin: bottom center;
            margin-top: -60vmax;
            margin-left: -2px;
            animation: tickNormal 60s linear infinite;
        }

        .clock-hand.reverse-fast {
            animation: tickReverse 1s linear infinite !important;
        }

        @keyframes tickNormal {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes tickReverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        .step {
            display: none;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }
        .step.active {
            display: block;
            opacity: 1;
        }
        h1 {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            letter-spacing: 2px;
        }
        .btn-group {
            display: flex;
            gap: 2rem;
            justify-content: center;
        }
        button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 0.8rem 2rem;
            font-family: 'Courier Prime', monospace;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
        }
        .glitch-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: screen; /* Değiştirildi: Siyah ekranda görünmesi için */
        }
        @keyframes glitch-anim {
            0% { opacity: 0; transform: translate(0, 0); }
            10% { opacity: 0.5; transform: translate(-5px, 5px); }
            20% { opacity: 0.2; transform: translate(5px, -5px); }
            30% { opacity: 0.6; transform: translate(-5px, -5px); }
            40% { opacity: 0; transform: translate(0, 0); }
            100% { opacity: 0; }
        }
        .glitching {
            animation: glitch-anim 0.4s infinite;
        }
        .input-memory {
            background: transparent;
            border: none;
            border-bottom: 1px solid #fff;
            color: #fff;
            font-family: 'Courier Prime', monospace;
            font-size: 1.5rem;
            text-align: center;
            width: 100%;
            padding: 0.5rem;
            outline: none;
            margin-top: 1rem;
        }
        .red-text {
            color: #f43f5e;
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
            font-weight: 700;
        }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-D0DRJXGNWT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-D0DRJXGNWT');
    </script>
</head>
<body>
    <div class="psy-bg"></div>
    <div class="clock-container">
        <div class="clock-hand" id="clockHand"></div>
    </div>
    <div class="glitch-overlay" id="glitch"></div>
    
    <div class="container">
        
        <!-- STEP 1 -->
        <div class="step active" id="step1" style="opacity: 0;">
            <h1 id="text1" data-i18n="proje_gri.q1">Daha önce burada mıydın?</h1>
            <div class="btn-group">
                <button onclick="nextStep(2)" data-i18n="proje_gri.yes">Evet</button>
                <button onclick="nextStep(2)" data-i18n="proje_gri.no">Hayır</button>
            </div>
        </div>

        <!-- STEP 2 -->
        <div class="step" id="step2">
            <h1 data-i18n="proje_gri.q2">Hatırladığın her şey gerçek olmayabilir.</h1>
            <p style="margin-bottom: 1rem; color: #888;" data-i18n="proje_gri.q2_sub">Bana en net hatırladığın bir anıyı yaz:</p>
            <input type="text" class="input-memory" id="memoryInput" autocomplete="off" spellcheck="false">
        </div>

        <!-- STEP 3 -->
        <div class="step" id="step3">
            <h1 class="red-text" data-i18n="proje_gri.q3">Yanlış hatırlıyorsun.</h1>
        </div>

        <!-- STEP 4 -->
        <div class="step" id="step4">
            <h1 style="font-size: 1.5rem; line-height: 2rem;" data-i18n="proje_gri.q4">Zaman aynı akmaz.<br>Gerçeklik tekrar etmeye başladığında hazır ol.</h1>
        </div>

        <!-- STEP 5 -->
        <div class="step" id="step5">
            <h1 style="font-size: 3rem; margin-bottom: 0.5rem;">PROJE: GRİ</h1>
            <h2 class="red-text" style="font-size: 1.5rem; letter-spacing: 10px; margin-bottom: 4rem;">2028</h2>
            <button onclick="window.location.href='index.html'" data-i18n="proje_gri.wake_up">Uyan</button>
        </div>

    </div>

    <script src="i18n.js"></script>
    <script>
        const glitchElement = document.getElementById('glitch');

        function triggerGlitch(duration) {
            glitchElement.classList.add('glitching');
            setTimeout(() => {
                glitchElement.classList.remove('glitching');
            }, duration);
        }

        function nextStep(step) {
            triggerGlitch(500);
            
            document.querySelectorAll('.step').forEach(el => {
                el.style.opacity = '0';
                setTimeout(() => {
                    el.classList.remove('active');
                }, 1000);
            });

            setTimeout(() => {
                const nextEl = document.getElementById('step' + step);
                nextEl.classList.add('active');
                setTimeout(() => {
                    nextEl.style.opacity = '1';
                    if (step === 2) {
                        document.getElementById('memoryInput').focus();
                    }
                }, 100);
            }, 1000);
        }

        // Memory input distortion logic
        const memoryInput = document.getElementById('memoryInput');
        const zalgoChars = ['#','*','%','@','!','?','&','$','_','-','+','=', '<', '>'];
        let typeCount = 0;

        memoryInput.addEventListener('input', function(e) {
            typeCount++;
            
            // Spin clock backwards when memory is being rewritten
            const clock = document.getElementById('clockHand');
            clock.classList.add('reverse-fast');
            clearTimeout(window.clockTimeout);
            window.clockTimeout = setTimeout(() => {
                clock.classList.remove('reverse-fast');
            }, 300);

            // Randomly distort the text they are typing
            if (typeCount > 3) {
                let currentVal = this.value;
                let newVal = '';
                for(let i=0; i<currentVal.length; i++) {
                    if (Math.random() > 0.6) {
                        newVal += zalgoChars[Math.floor(Math.random() * zalgoChars.length)];
                    } else {
                        newVal += currentVal[i];
                    }
                }
                this.value = newVal;
                if (Math.random() > 0.5) triggerGlitch(200);
            }

            // After typing some characters, auto progress to step 3
            if (typeCount > 12) {
                this.disabled = true;
                this.value = window.i18n.translations.proje_gri.memory_error || "BUNU SEN YAŞAMADIN";
                this.style.color = "#f43f5e";
                triggerGlitch(800);
                setTimeout(() => {
                    nextStep(3);
                    setTimeout(() => {
                        nextStep(4);
                        setTimeout(() => {
                            nextStep(5);
                        }, 5000);
                    }, 4000);
                }, 1500);
            }
        });

        // Initial fade in delay waiting for i18n
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const s1 = document.getElementById('step1');
                s1.style.opacity = '1';
            }, 1000);
        });
    </script>
</body>
</html>
